alerts:
  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: metrics-alerting
    runbook: docs/alerts.md#alert-1-high-request-error-rate
  - name: HighUserLatency
    severity: warning
    condition: latency_p95_ms > 3000 for 10m
    type: symptom-based
    owner: metrics-alerting
    runbook: docs/alerts.md#alert-2-high-user-latency
  - name: LowResponseQuality
    severity: warning
    condition: quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: metrics-alerting
    runbook: docs/alerts.md#alert-3-low-response-quality
