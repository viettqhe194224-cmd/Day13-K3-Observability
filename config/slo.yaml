service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: At least 99.5% of 28-day measurement windows keep P95 latency at or below 3000 ms.
  error_rate_pct:
    objective: 2
    target: 99.0
    note: At least 99.0% of 28-day measurement windows keep request error rate at or below 2%.
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Daily aggregate model cost must not exceed USD 2.50.
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: At least 95.0% of 28-day measurement windows keep average quality score at or above 0.75.
